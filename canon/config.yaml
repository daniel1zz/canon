# yaml-language-server: $schema=../.canon/config.schema.json
main: main
# 必须在 main 的代码树上执行成功；floor_timing: after 下合入不跑它，main 前移后在后台跑（canon floor watch）
# 测试经过 scripts/test.sh：统一的测试超时，git 只读脚本写的固定配置，本机 git 设置改变不了结果（C-247）
floor: "bun install --frozen-lockfile && bunx tsc --noEmit -p tsconfig.json && sh scripts/test.sh --parallel=4"
# 先合后测（D-31、BR-2218）：开发阶段合入不等 floor，main 没通过时由 canon work start --fix-main 开的变更向前修
floor_timing: after
# floor_timing: after 下后台全量测试按批运行（D-59、BR-2311）：main 安静 floor_quiet_minutes 分钟、没测过的合入达到 floor_max_untested 个、
# 或最老的没测过的移动已过 floor_max_age_minutes 分钟，三者任一满足就测最新提交；main 没通过时不等。立即测：canon floor watch --now
# 下面三项写的是默认值
floor_quiet_minutes: 20
floor_max_untested: 10
floor_max_age_minutes: 60
# 代码评审按批运行（D-59、BR-2314）：未评审的合入达到 review_max_unreviewed 个、或最老的已过 review_max_age_minutes 分钟才评审，一次评审整个范围。
# 立即评审攒着的：CANON_CODE_REVIEW_FORCE=1 bun scripts/code-review.ts
# 下面两项写的是默认值
review_max_unreviewed: 10
review_max_age_minutes: 60
# 代码目录和规则领域一一对应（D-15）：canon/rules/work/land ↔ src/work/land；src/kernel 是不属于任何业务领域的共享内核
code_root: src
shared:
  - src/kernel
# 扫描规则编号的测试文件
tests:
  - "src/**/*.test.ts"
# canon work test 运行一个测试文件的命令，{file} 换成它的路径（D-23）；和 floor 一样经过 scripts/test.sh（C-247）
test_command: "sh scripts/test.sh {file}"
# canon work test 每次都跑（BR-2297）：读遍 src/ 的测试，改动不导入它、也不碰它点名的规则时照样能弄坏它（C-240 弄坏 BR-2223 那次，C-262）。
# 找法：测试里递归读真实仓库 src/ 的是第一个（grep readdirSync、Bun.Glob、scanSync，C-281）；第二个读随 canon 发出的 skill（BR-2096）。新增这样的测试时加在这里
always_tests:
  - "src/work/session/worktree-lock-callers.test.ts"
  - "src/cli/install/install.test.ts"
# canon work test 在测试之前跑一次（BR-2226）：和 floor 的类型检查那一步相同，类型错误不用等 floor 才发现（C-163 曾因此被拒）
typecheck_command: "bunx tsc --noEmit -p tsconfig.json"
# 每个会话开始时都会读到的文件：改了它们，合入时评审同一条要求是否写在多处（BR-2143）；工作说明的源码也算：
# src/cli/guide.ts 拼接，各领域目录下的 guide.ts 写自己的条目（C-133），新增一个这样的文件时加在这里
instructions:
  - CLAUDE.md
  - src/cli/guide.ts
  - src/knowledge/documents/guide.ts
  - src/knowledge/query/guide.ts
  - src/knowledge/review/guide.ts
  - src/work/drop/guide.ts
  - src/work/hooks/guide.ts
  - src/work/humans/guide.ts
  - src/work/issues/guide.ts
  - src/work/land/guide.ts
  - src/work/session/guide.ts
  - src/work/verify/guide.ts
# 每个会话固定加载的文字（根目录 CLAUDE.md、工作说明、skill 描述）合计超过这么多字节时，canon check 和 canon work test 提示一行，不拒绝合入（BR-2257、D-37）。
# C-59 删减后合计 11226 字节，设成 12000：只留一点余量，再涨就看到提示
session_text_budget: 12000
# 只改这些路径的合入不跑 floor（BR-2164）：代码树和 main 上已测过的一样。
# 依据（C-122 核查）：测试只在临时仓库里读写 canon/ 下的文件；读真实仓库文件的只有 .claude/skills（BR-2096、install）和 scripts/，所以不列它们，也不列 canon/config.yaml
# 测试读这些路径下真实文件时 canon check 报 test-reads-skip-path（BR-2181）；规则和代码列表的核对在 canon check 里（BR-2180，C-145）
floor_skip_paths:
  - canon/rules
  - canon/decisions
  - canon/changes
  - canon/notes
  - canon/product.md
  - canon/backlog.md
# 轮到的合入者最多把几个合入一起测、只跑一次 floor（D-26、BR-2172）；floor_timing: after 下不分批
land_batch_max: 4
# 新 worktree 里执行一次，环境里有 CANON_PORT（BR-2267）。依赖安装的推荐配置（C-103）：setup 只做依赖安装。
# bun 用默认设置：macOS 上默认用 clonefile 装包，Linux 上用 hardlink，每个 worktree 几乎不多花时间和空间（bun.com/docs/pm/cli/install）。
# pnpm 在 pnpm-workspace.yaml 里写 virtualStoreType: global：每个 worktree 的 node_modules 只放指向全局仓库的链接（pnpm.io/git-worktrees）。
# 每个变更一个端口（D-41）：在这里写 ports: 4100-4199 这样的范围，setup 和 hook 命令的环境里就有 CANON_PORT；canon 自己不起本地服务，没有设。
setup: "bun install"
# 规则和决策文字的评审：从 stdin 读提示，在 stdout 输出 JSON 结论
review: "scripts/review-claude.sh"
# 合入移动 main 之后把 main 推到这个 git 远端（D-38、BR-2259）；推送失败不改变合入结果，canon brief 提示没推上去的提交数
remote: origin
# 生命周期 hook（D-2、D-3）：每项是一条命令或命令列表
hooks:
  after_land:
    # 评审的批量阈值 review_max_unreviewed、review_max_age_minutes 写在顶层，不在 hooks 下
    # 合入后的代码评审（C-2）：只找安全和并发问题，一个根因一个 issue，写到 GitHub（负责人 2026-11-03 同意开启）；用 sonnet（负责人 2026-11-04，C-308）
    # FORCE_PROMPT_CACHING_5M=1：每次评审的内容只用一次，5 分钟缓存的写入比 1 小时便宜（C-326）
    - "FORCE_PROMPT_CACHING_5M=1 CANON_CODE_REVIEW_AI='claude -p --model sonnet --output-format text' bun scripts/code-review.ts"
  after_green:
    # main 的后台 floor 通过后，从这个测过的提交重新构建主 checkout 的 dist/canon（PATH 上的 canon），
    # 不从没测过的 main 构建：合入了把命令行弄坏的变更时，修复变更还能用旧的 canon 合进来（D-31、BR-2222）
    - 'bun build --compile src/cli/main.ts --outfile "$CANON_PRIMARY/dist/canon"'
# 每个检查的复审日期（BR-2069）：到期后 `canon stats` 把它列为待复审
check_reviews:
  on-main: "2027-02-03"
  no-floor: "2027-02-03"
  dirty: "2027-02-03"
  no-claim: "2027-02-03"
  lessons: "2027-02-03"
  timeout: "2027-02-03"
  conflict: "2027-02-03"
  floor: "2027-02-03"
  check: "2027-02-03"
  review: "2027-02-03"
  hook: "2027-02-03"
  main-moved: "2027-02-03"
  main-dirty: "2027-02-03"
  claim: "2027-02-03"
  setup: "2027-02-03"
  evidence: "2027-02-04"
  config: "2027-02-04"
  config-key: "2027-02-04"
  activate: "2027-02-04"
  rule-changed: "2027-02-04"
  passes: "2027-02-04"
  source: "2027-02-04"
  moved-during-land: "2027-02-04"
  release: "2027-02-05"
