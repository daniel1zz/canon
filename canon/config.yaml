main: main
# 必须在即将成为 main 的代码树上执行成功
floor: "bun install --frozen-lockfile && bunx tsc --noEmit -p tsconfig.json && bun test"
# 扫描规则编号的测试文件
tests:
  - "src/**/*.test.ts"
# 新 worktree 里执行一次
setup: "bun install"
# 规则和决策文字的评审：从 stdin 读提示，在 stdout 输出 JSON 结论
review: "scripts/review-claude.sh"
# 生命周期 hook（D-2、D-3）：每项是一条命令或命令列表
hooks:
  # 合入后在主 checkout 重新构建 dist/canon，让 PATH 上的 canon 和 main 一致
  after_land: "bun run build"
# 每个检查的复审日期（BR-2069）：到期后 `canon stats` 把它列为待复审
check_reviews:
  on-main: "2027-02-03"
  no-floor: "2027-02-03"
  dirty: "2027-02-03"
  no-claim: "2027-02-03"
  timeout: "2027-02-03"
  conflict: "2027-02-03"
  floor: "2027-02-03"
  check: "2027-02-03"
  review: "2027-02-03"
  hook: "2027-02-03"
  main-moved: "2027-02-03"
  main-dirty: "2027-02-03"
  claim: "2027-02-03"
  setup: "2027-02-03"
