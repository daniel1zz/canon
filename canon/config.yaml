# yaml-language-server: $schema=../.canon/config.schema.json
main: main
# 必须在 main 的代码树上执行成功；floor_timing: after 下合入不跑它，main 前移后在后台跑（canon floor watch）
floor: "bun install --frozen-lockfile && bunx tsc --noEmit -p tsconfig.json && bun test"
# 先合后测（D-31、BR-2218）：开发阶段合入不等 floor，main 没通过时由 canon work start --fix-main 开的变更向前修
floor_timing: after
# 代码目录和规则领域一一对应（D-15）：canon/rules/work/land ↔ src/work/land；src/kernel 是不属于任何业务领域的共享内核
code_root: src
shared:
  - src/kernel
# 扫描规则编号的测试文件
tests:
  - "src/**/*.test.ts"
# canon work test 运行一个测试文件的命令，{file} 换成它的路径（D-23）
test_command: "bun test {file}"
# canon work test 在测试之前跑一次（BR-2226）：和 floor 的类型检查那一步相同，类型错误不用等 floor 才发现（C-163 曾因此被拒）
typecheck_command: "bunx tsc --noEmit -p tsconfig.json"
# 每个会话开始时都会读到的文件：改了它们，合入时评审同一条要求是否写在多处（BR-2143）；工作说明的源码也算：
# src/cli/guide.ts 拼接，各领域目录下的 guide.ts 写自己的条目（C-133），新增一个这样的文件时加在这里
instructions:
  - CLAUDE.md
  - src/cli/guide.ts
  - src/config/guide.ts
  - src/knowledge/documents/guide.ts
  - src/knowledge/query/guide.ts
  - src/knowledge/review/guide.ts
  - src/work/drop/guide.ts
  - src/work/humans/guide.ts
  - src/work/issues/guide.ts
  - src/work/land/guide.ts
  - src/work/session/guide.ts
  - src/work/verify/guide.ts
# 只改这些路径的合入不跑 floor（BR-2164）：代码树和 main 上已测过的一样。
# 依据（C-122 核查）：测试只在临时仓库里读写 canon/ 下的文件；读真实仓库文件的只有 .claude/skills（BR-2096、install）和 scripts/，所以不列它们，也不列 canon/config.yaml
# 测试读这些路径下真实文件时 canon check 报 test-reads-skip-path（BR-2181）；规则和代码列表的核对在 canon check 里（BR-2180，C-145）
floor_skip_paths:
  - canon/rules
  - canon/decisions
  - canon/changes
  - canon/notes
  - canon/product.md
  - canon/backlog.md
# 轮到的合入者最多把几个合入一起测、只跑一次 floor（D-26、BR-2172）；floor_timing: after 下不分批
land_batch_max: 4
# 新 worktree 里执行一次
setup: "bun install"
# 规则和决策文字的评审：从 stdin 读提示，在 stdout 输出 JSON 结论
review: "scripts/review-claude.sh"
# 生命周期 hook（D-2、D-3）：每项是一条命令或命令列表
hooks:
  after_land:
    # 合入后的代码评审（C-2）：只找安全和并发问题，一个根因一个 issue，写到 GitHub（负责人 2026-11-03 同意开启）
    - "bun scripts/code-review.ts"
  after_green:
    # main 的后台 floor 通过后，从这个测过的提交重新构建主 checkout 的 dist/canon（PATH 上的 canon），
    # 不从没测过的 main 构建：合入了把命令行弄坏的变更时，修复变更还能用旧的 canon 合进来（D-31、BR-2222）
    - 'bun build --compile src/cli/main.ts --outfile "$CANON_PRIMARY/dist/canon"'
# 每个检查的复审日期（BR-2069）：到期后 `canon stats` 把它列为待复审
check_reviews:
  on-main: "2027-02-03"
  no-floor: "2027-02-03"
  dirty: "2027-02-03"
  no-claim: "2027-02-03"
  lessons: "2027-02-03"
  timeout: "2027-02-03"
  conflict: "2027-02-03"
  floor: "2027-02-03"
  check: "2027-02-03"
  review: "2027-02-03"
  hook: "2027-02-03"
  main-moved: "2027-02-03"
  main-dirty: "2027-02-03"
  claim: "2027-02-03"
  setup: "2027-02-03"
  evidence: "2027-02-04"
  config: "2027-02-04"
  config-key: "2027-02-04"
  activate: "2027-02-04"
  rule-changed: "2027-02-04"
  passes: "2027-02-04"
  source: "2027-02-04"
  moved-during-land: "2027-02-04"
